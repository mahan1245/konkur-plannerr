name: Deploy ZIP to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Extract project ZIP
        run: |
          rm -rf _site
          mkdir _site
          mkdir extracted

          unzip -q Mahan-main.zip -d extracted

          INDEX=$(find extracted -type f -iname "index.html" | head -n 1)

          if [ -z "$INDEX" ]; then
            echo "ERROR: index.html not found inside ZIP"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$INDEX")

          cp -R "$PROJECT_DIR"/. _site/

          echo "Website files:"
          ls -la _site

      - name: Upload website
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build

    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
